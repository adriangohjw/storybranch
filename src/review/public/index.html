<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>storybranch review</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body
    class="min-h-full bg-zinc-950 text-zinc-100 antialiased font-sans leading-normal"
  >
    <header class="border-b border-zinc-800 px-5 py-4">
      <h1 class="text-lg font-semibold tracking-tight">storybranch review</h1>
      <p id="meta" class="mt-1 text-sm text-zinc-400"></p>
      <div class="mt-3 flex flex-wrap items-center gap-3">
        <label class="flex items-center gap-2 text-sm text-zinc-300">
          Filter
          <select
            id="filter"
            class="rounded-md border border-zinc-700 bg-zinc-900 px-2 py-1 text-sm text-zinc-100"
          >
            <option value="attention">Needs attention</option>
            <option value="changed">Changed</option>
            <option value="new">New</option>
            <option value="stale">Stale</option>
            <option value="error">Error</option>
            <option value="unchanged">Unchanged</option>
            <option value="all">All</option>
          </select>
        </label>
        <button
          id="accept-all"
          type="button"
          class="rounded-md bg-zinc-100 px-3 py-1.5 text-sm font-medium text-zinc-900 hover:bg-white"
        >
          Accept all
        </button>
      </div>
    </header>
    <main class="grid min-h-[calc(100vh-9rem)] grid-cols-1 lg:grid-cols-[minmax(240px,360px)_1fr]">
      <aside id="groups" class="overflow-auto border-b border-zinc-800 p-2 lg:border-b-0 lg:border-r"></aside>
      <section id="viewer" class="overflow-auto p-4">
        <p class="placeholder text-sm text-zinc-500">Select a snapshot to compare.</p>
        <div id="panels" class="grid gap-4 md:grid-cols-3" hidden>
          <figure class="m-0">
            <figcaption class="mb-1 text-xs text-zinc-500">Baseline</figcaption>
            <img
              id="baseline"
              alt="baseline"
              class="block w-full rounded border border-zinc-800 bg-zinc-900/50"
            />
          </figure>
          <figure class="m-0">
            <figcaption class="mb-1 text-xs text-zinc-500">Actual</figcaption>
            <img
              id="actual"
              alt="actual"
              class="block w-full rounded border border-zinc-800 bg-zinc-900/50"
            />
          </figure>
          <figure id="diff-panel" class="m-0">
            <figcaption class="mb-1 text-xs text-zinc-500">Diff</figcaption>
            <img
              id="diff"
              alt="diff"
              class="block w-full rounded border border-zinc-800 bg-zinc-900/50"
            />
          </figure>
        </div>
        <div id="detail" class="mt-4 text-sm text-zinc-400"></div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
