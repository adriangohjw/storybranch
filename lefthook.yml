# yaml-language-server: $schema=https://lefthook.dev/schema.json
# Ultracite pre-commit job: https://www.ultracite.ai/docs/git-hooks#lefthook

pre-commit:
  jobs:
    - name: ultracite fix
      run: bunx ultracite fix {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.scss"
        - "*.less"
        - "*.vue"
        - "*.svelte"
        - "*.astro"
        - "*.html"
        - "*.md"
        - "*.mdx"
        - "*.yaml"
        - "*.yml"
        - "*.graphql"
        - "*.gql"
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: bun run lint

    - name: format
      run: bun run format

    - name: typecheck
      run: bun run typecheck
