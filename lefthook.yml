# yaml-language-server: $schema=https://lefthook.dev/schema.json

pre-commit:
  jobs:
    - name: lint fix
      run: bunx oxlint --fix {staged_files}
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      stage_fixed: true

    - name: format
      run: bunx oxfmt {staged_files}
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,json,jsonc,css,md,mdx,yaml,yml}"
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: bun run lint

    - name: format
      run: bun run format

    - name: typecheck
      run: bun run typecheck
