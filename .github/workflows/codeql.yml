name: "CodeQL Advanced"

on:
  schedule:
    - cron: "15 9 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: ./.github/workflows/codeql-analyze.yml
