name: CI

on:
  push:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Lint
        run: bun run lint

  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@v2.2.0
        with:
          advanced-security: true

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Typecheck
        run: bun run typecheck

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Format
        run: bun run format

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Build
        run: bun run build

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@storybranch/core"
          - "@storybranch/report"
          - "@storybranch/review-ui"
          - "@adriangohjw/storybranch"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Test
        run: bunx turbo run test --filter="${{ matrix.package }}"
        env:
          STORYBRANCH_E2E_BROWSERS: skip

  test-browser:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            playwright: chromium
            capture: chrome
          - browser: firefox
            playwright: firefox
            capture: firefox
          - browser: edge
            playwright: msedge
            capture: edge
          - browser: webkit
            playwright: webkit
            capture: safari
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Install Playwright
        run: bunx playwright install --with-deps ${{ matrix.playwright }}
      - name: Test
        run: bunx turbo run test --filter=@adriangohjw/storybranch ${{ matrix.capture == 'chrome' && '--filter=@storybranch/core' || '' }}
        env:
          STORYBRANCH_E2E_BROWSERS: ${{ matrix.capture }}

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.18
      - name: Install Playwright
        run: bunx playwright install --with-deps chromium firefox msedge webkit
      - name: Build CLI
        run: bunx turbo run build --filter=@adriangohjw/storybranch
      - name: Build Storybook
        run: bunx storybook build --config-dir packages/fixture/.storybook --output-dir packages/fixture/storybook-static
      - name: Test
        run: |
          args=(test --build --cwd packages/fixture --browsers "chrome,firefox,edge,safari" --exit-once)
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            args+=(--only-changed)
          fi
          node apps/cli/bin/storybranch.js "${args[@]}"
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: storybranch-visual
          if-no-files-found: ignore
          path: |
            packages/fixture/.storybranch/report.json
            packages/fixture/.storybranch/actual
            packages/fixture/.storybranch/diff

  visual-comment:
    needs: visual
    if: failure() && github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.18
      - uses: actions/download-artifact@v8.0.2
        with:
          name: storybranch-visual
          path: storybranch-artifact
        continue-on-error: true
      - name: Update pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="$(find storybranch-artifact -name report.json -print -quit || true)"
          node scripts/ci/storybranch-pr-comment.mjs "${report:-missing}" "$RUN_URL" > /tmp/storybranch-comment.md
          pr="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number,headRepositoryOwner --jq "map(select(.headRepositoryOwner.login == \"$GITHUB_REPOSITORY_OWNER\")) | .[0].number")"
          if [[ -z "${pr}" || "${pr}" == "null" ]]; then
            echo "no same-repo pull request for ${GITHUB_REF_NAME}"
            exit 0
          fi
          marker="<!-- storybranch-visual -->"
          id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [[ -n "${id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$(cat /tmp/storybranch-comment.md)"
          else
            gh pr comment "$pr" --body-file /tmp/storybranch-comment.md
          fi

  ci-passed:
    name: ✅ CI passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - jactionlint
      - typecheck
      - format
      - build
      - test
      - test-browser
      - visual
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
