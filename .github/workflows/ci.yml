name: CI

on:
  push:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Lint
        run: bun run lint

  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@v2.2.0
        with:
          advanced-security: true

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Typecheck
        run: bun run typecheck

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Format
        run: bun run format

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Build
        run: bun run build

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@storybranch/core"
          - "@storybranch/report"
          - "@storybranch/review-ui"
          - "@adriangohjw/storybranch"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Test
        run: bunx turbo run test --filter="${{ matrix.package }}"
        env:
          STORYBRANCH_E2E_BROWSERS: skip

  test-browser:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            playwright: chromium
            capture: chrome
          - browser: firefox
            playwright: firefox
            capture: firefox
          - browser: edge
            playwright: msedge
            capture: edge
          - browser: webkit
            playwright: webkit
            capture: safari
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/tooling/github/setup
      - name: Install Playwright
        run: bunx playwright install --with-deps ${{ matrix.playwright }}
      - name: Test
        run: bunx turbo run test --filter=@adriangohjw/storybranch ${{ matrix.capture == 'chrome' && '--filter=@storybranch/core' || '' }}
        env:
          STORYBRANCH_E2E_BROWSERS: ${{ matrix.capture }}

  ci-passed:
    name: ✅ CI passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - jactionlint
      - typecheck
      - format
      - build
      - test
      - test-browser
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
