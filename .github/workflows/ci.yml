name: CI

on:
  push:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Lint
        run: bun run lint

  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@1027f0a131ab98bc7e191d995bfa15dbed5bbf8f # v2.2.0
        with:
          advanced-security: true

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Typecheck
        run: bun run typecheck

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Format
        run: bun run format

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Build
        run: bun run build

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@storybranch/core"
          - "@storybranch/report"
          - "@storybranch/review-ui"
          - "@adriangohjw/storybranch"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Test
        run: bunx turbo run test --filter="${{ matrix.package }}"
        env:
          STORYBRANCH_E2E_BROWSERS: skip

  test-chromium:
    name: test (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Install Playwright
        run: bunx playwright install --with-deps chromium
      - name: Test
        run: bunx turbo run test --filter=@adriangohjw/storybranch
        env:
          STORYBRANCH_E2E_BROWSERS: chrome

  test-firefox:
    name: test (firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Install Playwright
        run: bunx playwright install --with-deps firefox
      - name: Test
        run: bunx turbo run test --filter=@adriangohjw/storybranch
        env:
          STORYBRANCH_E2E_BROWSERS: firefox

  test-edge:
    name: test (edge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Install Playwright
        run: bunx playwright install --with-deps msedge
      - name: Test
        run: bunx turbo run test --filter=@adriangohjw/storybranch
        env:
          STORYBRANCH_E2E_BROWSERS: edge

  ci-passed:
    name: ✅ CI passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - jactionlint
      - typecheck
      - format
      - build
      - test
      - test-chromium
      - test-firefox
      - test-edge
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
