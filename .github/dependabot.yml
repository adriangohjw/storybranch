version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      aws:
        patterns:
          - "@aws-sdk/*"
      cli:
        patterns:
          - log-update
          - ora
          - picocolors
      hosted:
        patterns:
          - better-auth
          - zod
          - "@t3-oss/*"
      oxc:
        patterns:
          - oxlint*
          - ultracite
      playwright:
        patterns:
          - playwright
          - pixelmatch
          - pngjs
          - "@types/pngjs"
      prisma:
        patterns:
          - prisma*
          - kysely
          - pg
          - "@types/pg"
          - dotenv
      react:
        patterns:
          - react
          - react-dom
          - react-icons
          - sonner
          - "@types/react"
          - "@types/react-dom"
          - "@fontsource/*"
      repo:
        patterns:
          - turbo
          - lefthook
          - "@types/bun"
      storybook:
        patterns:
          - storybook
          - "@storybook/*"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - tailwind-merge
      tanstack:
        patterns:
          - "@tanstack/*"
          - nitro
      vite:
        patterns:
          - vite
          - "@vitejs/*"
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*
    commit-message:
      prefix: ci
