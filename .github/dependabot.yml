version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      aws:
        patterns:
          - "@aws-sdk/*"
      oxlint:
        patterns:
          - oxlint*
      pg:
        patterns:
          - pg
          - "@types/pg"
      png:
        patterns:
          - pngjs
          - "@types/pngjs"
      prisma:
        patterns:
          - prisma*
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      storybook:
        patterns:
          - storybook
          - "@storybook/*"
      t3:
        patterns:
          - "@t3-oss/*"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - tailwind-merge
      tanstack:
        patterns:
          - "@tanstack/*"
      vite:
        patterns:
          - vite
          - "@vitejs/*"
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*
    commit-message:
      prefix: ci
