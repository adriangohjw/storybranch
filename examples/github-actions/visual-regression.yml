# Copy this workflow and scripts/ci/storybranch-pr-comment.mjs.
# Storybook lives at the repo root in this file. Monorepos: docs/ci.md.
name: Visual regression

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: visual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build Storybook
        run: npx storybook build
      - name: Test pull request
        if: github.event_name == 'pull_request'
        run: npx storybranch test --build --only-changed --exit-once
      - name: Test main
        if: github.event_name == 'push'
        run: npx storybranch test --build --exit-once
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybranch-visual
          if-no-files-found: ignore
          path: |
            .storybranch/report.json
            .storybranch/actual
            .storybranch/diff

  comment:
    needs: visual
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybranch-visual
          path: storybranch-artifact
        continue-on-error: true
      - name: Update pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="$(find storybranch-artifact -name report.json -print -quit || true)"
          node scripts/ci/storybranch-pr-comment.mjs "${report:-missing}" "$RUN_URL" > /tmp/storybranch-comment.md
          marker="<!-- storybranch-visual -->"
          id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [[ -n "${id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$(cat /tmp/storybranch-comment.md)"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/storybranch-comment.md
          fi
